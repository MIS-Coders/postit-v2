services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      # host 5433 sudah dipakai container recruitment-db -> pakai 5434, loopback saja
      - "127.0.0.1:5434:5432"
    networks:
      - rag_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: 
      context: ./api
      dockerfile: Dockerfile
    container_name: rag_flask_api
    restart: unless-stopped
    ports:
      # host 3018 -> https://postit-ai.mahkotagroup.com (container tetap 5000)
      - "3018:5000"
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-rag_user}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-rag_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rag_network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: rag_svelte_web
    restart: unless-stopped
    ports:
      # host 3017 -> https://postit-v2.mahkotagroup.com (dev server vite tetap 5173)
      - "3017:5173"
    environment:
      - ORIGIN=${ORIGIN:-https://postit-v2.mahkotagroup.com}
      - PUBLIC_API_URL=${PUBLIC_API_URL:-https://postit-ai.mahkotagroup.com}
      - DATABASE_URL=postgres://${POSTGRES_USER:-rag_user}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-rag_db}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - SOP_STORAGE_DIR=${SOP_STORAGE_DIR:-../storage/sop}
      - HOST=0.0.0.0
      - PORT=5173
    depends_on:
      - api
    networks:
      - rag_network

volumes:
  pgdata:

networks:
  rag_network:
    driver: bridge